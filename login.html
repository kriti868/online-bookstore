<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - BookHaven</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<div class="logo">Book<span>Haven</span></div>
<nav>
<a href="index.html">Home</a>
<a href="catalog.html">Catalog</a>
<a href="cart.html">Cart</a>
<a href="login.html">Login</a>
<a href="registration.html">Register</a>
<a href="profile.html">Profile</a>
</nav>
</header>

<div class="container">
<div class="form-box">
<h2>Login</h2>
<form onsubmit="loginUser(event)">
<div class="form-group">
<label>Email</label>
<input type="email" id="loginEmail" required>
<div id="loginEmailError" class="error"></div>
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="loginPassword" required>
<div id="loginPasswordError" class="error"></div>
</div>
<button type="submit" class="btn" style="width:100%">Login</button>
</form>
<p style="margin-top:15px; text-align:center;">
Don't have an account? <a href="registration.html">Register here</a>
</p>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
